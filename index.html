<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST</title>
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: sans-serif;
            padding: 20px;
        }
        .btn {
            background: #00e5ff;
            color: #000;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>ТЕСТ</h1>
    <p>Если кнопки нажимаются — JavaScript работает!</p>
    <button class="btn" onclick="alert('РАБОТАЕТ!')">Нажми меня</button>
    <button class="btn" id="testBtn">Или эту</button>
    
    <script>
        console.log('Script loaded!');
        
        document.getElementById('testBtn').addEventListener('click', function() {
            alert('Вторая кнопка тоже работает!');
        });
    </script>
</body>
</html>
