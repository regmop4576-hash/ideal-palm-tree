<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roleplay_LEGO</title>
    <style>
        /* CSS Variables & Base Styles */
        :root {
            --bg-color: #000000;
            --nav-bg: #111111;
            --surface-bg: #1a1a1a;
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa;
            --accent-blue: #00e5ff;
            --accent-purple: #b388ff;
            --msg-user: #0d2a4a;
            --msg-bot: #1e1e1e;
            --msg-whisper: rgba(44, 26, 77, 0.7);
            --action-color: #888888;
            --danger: #ff5252;
            --success: #69f0ae;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            overscroll-behavior-y: none;
        }

        /* Layout */
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .view-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            display: none;
            flex-direction: column;
        }

        .view-container.active {
            display: flex;
        }

        /* Bottom Navigation */
        #nav-bar {
            flex-shrink: 0;
            height: 60px;
            background-color: var(--nav-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #333;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 44px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item .icon { font-size: 20px; margin-bottom: 2px; }
        .nav-item.active { color: var(--accent-blue); }
        .nav-item.active .icon { color: var(--accent-blue); }

        /* Generic Header */
        .header {
            height: 50px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: var(--nav-bg);
            border-bottom: 1px solid #333;
            font-weight: bold;
        }

        /* Chat View */
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        
        #chat-messages::-webkit-scrollbar { width: 4px; }
        #chat-messages::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .message-wrapper.user { align-self: flex-end; }
        .message-wrapper.assistant { align-self: flex-start; }
        .message-wrapper.system { align-self: flex-end; }

        .message {
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 15px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user .message {
            background-color: var(--msg-user);
            border-bottom-right-radius: 4px;
        }

        .assistant .message {
            background-color: var(--msg-bot);
            border-bottom-left-radius: 4px;
        }

        .system .message {
            background-color: var(--msg-whisper);
            border: 1px dashed var(--accent-purple);
            border-bottom-right-radius: 4px;
        }

        .action {
            color: var(--action-color);
            font-style: italic;
        }

        .msg-actions {
            display: flex;
            gap: 12px;
            margin-top: 4px;
            font-size: 12px;
            color: var(--text-secondary);
            padding: 0 4px;
        }

        .user .msg-actions, .system .msg-actions { justify-content: flex-end; }
        .msg-action-btn { cursor: pointer; padding: 4px 0; min-height: 24px; }

        /* Input Area */
        .input-area {
            flex-shrink: 0;
            background: var(--nav-bg);
            padding: 10px 16px;
            border-top: 1px solid #333;
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        .whisper-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            min-width: 44px;
            font-size: 20px;
            background: var(--surface-bg);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .whisper-toggle.active {
            background: var(--accent-purple);
        }

        #chat-input {
            flex: 1;
            background: var(--surface-bg);
            color: var(--text-primary);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 12px 16px;
            font-size: 15px;
            resize: none;
            min-height: 44px;
            max-height: 30vh;
            overflow-y: auto;
            font-family: inherit;
        }

        #chat-input:focus {
            border-color: var(--accent-blue);
        }

        .send-btn {
            background: var(--accent-blue);
            color: #000;
            border: none;
            border-radius: 50%;
            min-height: 44px;
            min-width: 44px;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Lists (Characters, Personas) */
        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .list-item {
            background: var(--surface-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
        }

        .list-item.active-item {
            border-color: var(--accent-blue);
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.2);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 18px;
        }
        
        .item-desc {
            font-size: 14px;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .fab {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent-blue);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(0, 229, 255, 0.4);
            cursor: pointer;
            z-index: 10;
        }

        /* Forms & Settings */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        input[type="text"], input[type="number"], input[type="password"], textarea.form-input {
            background: var(--bg-color);
            border: 1px solid #333;
            color: var(--text-primary);
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }

        input:focus, textarea.form-input:focus { border-color: var(--accent-blue); }

        .btn-primary {
            background: var(--accent-blue);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: var(--surface-bg);
            width: 100%;
            max-height: 90vh;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s ease-out;
            overflow-y: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .close-modal {
            font-size: 24px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
        }

        /* Loading Overlay */
        #loader {
            position: absolute;
            top: 10px;
            right: 16px;
            font-size: 14px;
            color: var(--accent-blue);
            display: none;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- Chat View -->
    <div id="view-chat" class="view-container active">
        <div class="header">
            <div id="chat-header-title">Чат</div>
            <div id="loader">Печатает...</div>
        </div>
        <div id="chat-messages"></div>
        <div class="input-area">
            <div id="btn-whisper" class="whisper-toggle" title="Шёпот Автора (System Message)">🤫</div>
            <textarea id="chat-input" placeholder="Сообщение..." rows="1"></textarea>
            <button class="send-btn" id="btn-send">➤</button>
        </div>
    </div>

    <!-- Characters View -->
    <div id="view-chars" class="view-container">
        <div class="header">NPC (Персонажи)</div>
        <div class="list-container" id="list-chars"></div>
        <div class="fab" onclick="openModal('modal-form-char', {mode:'add'})">➕</div>
    </div>

    <!-- Personas View -->
    <div id="view-personas" class="view-container">
        <div class="header">Мои Персоны</div>
        <div class="list-container" id="list-personas"></div>
        <div class="fab" onclick="openModal('modal-form-persona', {mode:'add'})">➕</div>
    </div>

    <!-- Settings View -->
    <div id="view-settings" class="view-container">
        <div class="header">Настройки API</div>
        <div class="list-container">
            <div class="form-group">
                <label>OpenRouter API Key</label>
                <input type="password" id="api-key" placeholder="sk-or-v1-...">
            </div>
            <div class="form-group">
                <label>Model</label>
                <input type="text" id="api-model" placeholder="openrouter/auto">
            </div>
            <div class="form-group">
                <label>Temperature (0.1 - 2.0)</label>
                <input type="number" id="api-temp" step="0.1" min="0.1" max="2.0">
            </div>
            <div class="form-group">
                <label>Repetition Penalty (1.0 - 2.0)</label>
                <input type="number" id="api-rep" step="0.1" min="1.0" max="2.0">
            </div>
            <div class="form-group">
                <label>Global Prompt (System)</label>
                <textarea class="form-input" id="api-global" rows="4"></textarea>
            </div>
            <button class="btn-primary" onclick="saveSettings()">Сохранить настройки</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div id="nav-bar">
        <div class="nav-item active" data-view="view-chat">
            <div class="icon">💬</div>
            <span>Чат</span>
        </div>
        <div class="nav-item" data-view="view-chars">
            <div class="icon">🎭</div>
            <span>NPC</span>
        </div>
        <div class="nav-item" data-view="view-personas">
            <div class="icon">👤</div>
            <span>Персоны</span>
        </div>
        <div class="nav-item" data-view="view-settings">
            <div class="icon">⚙️</div>
            <span>Настройки</span>
        </div>
    </div>
</div>

<!-- Generic Modal Overlay -->
<div id="modal-container" class="modal-overlay">
    <div class="modal-content" id="modal-content">
        <!-- Content dynamically injected here -->
    </div>
</div>

<!-- Modal Templates (Hidden) -->
<template id="tpl-form-char">
    <div class="modal-header">
        <span id="modal-char-title">Создать NPC</span>
        <span class="close-modal" onclick="closeModal()">✕</span>
    </div>
    <div class="form-group">
        <label>Имя персонажа</label>
        <input type="text" id="inp-char-name">
    </div>
    <div class="form-group">
        <label>Промпт (Инструкции и характер)</label>
        <textarea class="form-input" id="inp-char-prompt" rows="6"></textarea>
    </div>
    <button class="btn-primary" id="btn-save-char">Сохранить</button>
</template>

<template id="tpl-form-persona">
    <div class="modal-header">
        <span id="modal-persona-title">Создать Персону</span>
        <span class="close-modal" onclick="closeModal()">✕</span>
    </div>
    <div class="form-group">
        <label>Имя</label>
        <input type="text" id="inp-persona-name">
    </div>
    <div class="form-group">
        <label>Лор (Описание)</label>
        <textarea class="form-input" id="inp-persona-lore" rows="6"></textarea>
    </div>
    <button class="btn-primary" id="btn-save-persona">Сохранить</button>
</template>

<template id="tpl-edit-msg">
    <div class="modal-header">
        <span>Редактировать сообщение</span>
        <span class="close-modal" onclick="closeModal()">✕</span>
    </div>
    <div class="form-group">
        <textarea class="form-input" id="inp-edit-msg" rows="8"></textarea>
    </div>
    <button class="btn-primary" id="btn-save-msg">Сохранить</button>
</template>


<script>
    /* ======================================================================
       1. DATA ARCHITECTURE & STATE MANAGEMENT
       ====================================================================== */
    
    const STORAGE_KEY = 'roleplay_lego_data';
    
    const DEMO_DATA = {
        apiProfiles: [
            { id: 1, name: "Default", key: "", model: "gryphe/mythomax-l2-13b" }
        ],
        globalSettings: {
            temperature: 0.9,
            repetitionPenalty: 1.1,
            globalPrompt: "Write in Russian. Be highly descriptive, creative, and stay strictly in character. Do not speak for the user."
        },
        personas: [
            { id: 1, name: "Каирана", lore: "Девушка с магией пламени и фейерверков. Любит экспериментировать и немного безрассудна." }
        ],
        characters: [
            { id: 1, name: "Эмбер", prompt: "Ты Эмбер. Уверенная, хитрая и заботливая. У тебя крылья и хвост с сердцевидным кончиком (bat-cat). Ты никогда не бываешь робкой или покорной." }
        ],
        chats: {
            "1": [
                { role: "assistant", content: "*Уселась на край стола, лениво покачивая хвостом с сердцевидным кончиком* Ну привет. Чего уставился? Неужели мои крылья выглядят так завораживающе сегодня?" }
            ]
        },
        state: {
            activeCharId: 1,
            activePersonaId: 1,
            activeApiId: 1
        }
    };

    // Глобальная переменная для In-Memory хранения
    window.appData = {};

    function initData() {
        let stored = null;

        // Пытаемся получить данные из localStorage, обернув в try-catch
        try {
            stored = localStorage.getItem(STORAGE_KEY);
        } catch (e) {
            console.warn("localStorage заблокирован (возможно, запуск по file://). Приложение работает в режиме In-Memory.");
        }

        if (stored) {
            try {
                window.appData = JSON.parse(stored);
                // Schema migrations fallback
                if(!window.appData.state) window.appData.state = DEMO_DATA.state;
                if(!window.appData.globalSettings) window.appData.globalSettings = DEMO_DATA.globalSettings;
            } catch (e) {
                window.appData = JSON.parse(JSON.stringify(DEMO_DATA));
            }
        } else {
            // Инициализация демо-данными
            window.appData = JSON.parse(JSON.stringify(DEMO_DATA));
            saveData();
        }
    }

    function saveData() {
        // Сохраняем в localStorage, если он доступен
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(window.appData));
        } catch (e) {
            // Игнорируем ошибку. Данные всё равно надежно лежат в объекте window.appData (в оперативной памяти)
            // Это обеспечит работу UI, логики чата и модалок в течение текущей сессии.
        }
    }

    function generateId() {
        return Date.now() + Math.floor(Math.random() * 1000);
    }


    /* ======================================================================
       2. UI/UX HELPERS & NAVIGATION
       ====================================================================== */

    const views = document.querySelectorAll('.view-container');
    const navItems = document.querySelectorAll('.nav-item');

    navItems.forEach(item => {
        item.addEventListener('click', () => {
            const viewId = item.getAttribute('data-view');
            switchView(viewId);
        });
    });

    function switchView(viewId) {
        views.forEach(v => v.classList.remove('active'));
        navItems.forEach(n => n.classList.remove('active'));
        
        document.getElementById(viewId).classList.add('active');
        document.querySelector(`.nav-item[data-view="${viewId}"]`).classList.add('active');

        if (viewId === 'view-chat') renderChat();
        if (viewId === 'view-chars') renderChars();
        if (viewId === 'view-personas') renderPersonas();
        if (viewId === 'view-settings') renderSettings();
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[tag]));
    }

    function formatMessageText(text) {
        let safeText = escapeHTML(text);
        // Regex: format text inside asterisks as actions
        safeText = safeText.replace(/\*([^\*]+)\*/g, '<span class="action">* $1 *</span>');
        return safeText;
    }


    /* ========================================
